const $=id=>document.getElementById(id);let drafts=[];try{drafts=JSON.parse(localStorage.getItem('zhijian-drafts')||'[]')}catch{};const titles=['失眠也消失了，安眠药也不吃了。','真可爱捏','放假第一天五点多就醒了，辗转难眠…','分享图片','动态 2026-09-24','又快要到中秋了。最近几天被老板催…'];function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function page(p){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===p));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===p));if(p==='drafts')renderDrafts()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));function preview(title,body){$('modal-title').textContent=title;$('modal-content').innerHTML=body;$('modal').showModal()}$('close').onclick=()=>$('modal').close();$('preview').onclick=()=>preview($('title').value,$('editor').innerHTML);function count(){$('count').textContent=$('editor').innerText.trim().length+' 字 · 自由记录'}$('editor').oninput=count;count();document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.val||null);count()}});$('link').onmousedown=e=>e.preventDefault();$('link').onclick=()=>{let u=prompt('输入链接（https://）');if(u&&/^https?:\/\//i.test(u))document.execCommand('createLink',false,u)};let activeDraft=null;$('save').onclick=()=>{const d={id:activeDraft||Date.now(),title:$('title').value,body:$('editor').innerHTML,tags:$('tags').value,category:$('category').value,date:$('date').value};drafts=drafts.filter(x=>x.id!==d.id);drafts.unshift(d);try{localStorage.setItem('zhijian-drafts',JSON.stringify(drafts));activeDraft=d.id;toast('草稿已保存')}catch{toast('浏览器存储不可用或空间不足')}};function renderDrafts(){let list=$('draft-list');list.replaceChildren();if(!drafts.length){list.innerHTML='<div class="paper empty">还没有草稿。开始记录第一个念头吧。</div>';return}drafts.forEach(d=>{let e=document.createElement('div');e.className='article';let h=document.createElement('h3');h.textContent=d.title||'无标题';let p=document.createElement('p');p.textContent=d.date+' · 点击继续编辑';e.append(h,p);e.onclick=()=>{activeDraft=d.id;$('title').value=d.title;$('editor').innerHTML=d.body;$('tags').value=d.tags;$('category').value=d.category;$('date').value=d.date;count();page('write')};list.append(e)})}titles.forEach((t,i)=>{let e=document.createElement('div');e.className='article';e.innerHTML='<span class="badge">动态</span><div class="date">2026 / 09 / '+[30,27,25,24,24,23][i]+'</div><h3></h3><p>生活记录　·　点击阅读 ↗</p>';e.querySelector('h3').textContent=t;e.onclick=()=>preview(t,i===1?$('editor').innerHTML:'<p>此条为参考截图中的文章标题，正文未提供。</p>');$('posts').append(e)});$('publish').onclick=()=>toast('原型演示：尚未连接 GitHub，文章未发布');$('refresh').onclick=()=>toast('已展示参考截图中的文章');$('new').onclick=()=>{activeDraft=null;$('title').value='';$('title').placeholder='给故事起个名字';$('editor').innerHTML='<p><br></p>';count();page('write');$('title').focus()};const fields=['owner','repo','branch','path','author'];try{let s=JSON.parse(localStorage.getItem('zhijian-settings')||'{}');fields.forEach(k=>{if(s[k])$(k).value=s[k]})}catch{}$('save-settings').onclick=()=>{try{localStorage.setItem('zhijian-settings',JSON.stringify(Object.fromEntries(fields.map(k=>[k,$(k).value]))));toast('设置已保存，Token 未保存')}catch{toast('当前浏览器不允许本地存储')}};$('test').onclick=()=>toast('交互原型：尚未接入 GitHub API');
</script></html>
